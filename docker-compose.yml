services:

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Start the server, pull the model (cached in the volume), keep running.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull gemma3:4b && wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q gemma3:4b"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  payara:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Overrides payara.agentic.llm.ollama.base-url from microprofile-config.properties
      PAYARA_AGENTIC_LLM_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama-models:
