# LLM backend for the Payara Agentic AI implementation.
# Keys checked against Payara source, tag payara-server-7.2026.9:
# appserver/agentic-ai/agentic-ai-core/.../llm/LlmBackendFactory.java
payara.agentic.llm.provider=ollama
payara.agentic.llm.model=gemma3:4b

# Used when Payara runs on your machine. docker-compose.yml overrides it with
# PAYARA_AGENTIC_LLM_OLLAMA_BASE_URL=http://ollama:11434
payara.agentic.llm.ollama.base-url=http://localhost:11434
